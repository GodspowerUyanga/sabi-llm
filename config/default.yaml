# SABI default configuration
# Every value here can be overridden by an environment variable named
# SABI_<KEY_IN_UPPERCASE>, e.g. SABI_TEMPERATURE=0.2 or SABI_MODEL_PATH=...

# ---- Model ----
model_path: models/sabi-v1.Q4_K_M.gguf
hf_repo_id: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF # official Qwen repo (verified ~2GB Q4_K_M; our own Doctorgp1/sabi-v1 upload was mismatched at 4.68GB — see REPORT.md §6/§13)
hf_filename: qwen2.5-coder-3b-instruct-q4_k_m.gguf         # file to download from that repo; saved locally as model_path above
hf_revision: main                              # branch / tag / commit
context_length: 4096
max_tokens: 1024
temperature: 0.4
top_p: 0.9
n_threads: 0          # 0 = auto (use all physical cores)
n_batch: 256          # prompt-processing batch size; higher = faster prefill, more RAM
n_gpu_layers: 0       # 0 = CPU-only; the ADTC target laptop has no discrete GPU

# ---- Runtime ----
workspace_dir: sabi_workspace
prompts_dir: prompts
memory_file: .sabi/memory.json
vector_store_file: .sabi/vector_store.json

# ---- Hardware limits (ADTC 2026 ceiling) ----
ram_ceiling_gb: 7.0
ram_target_gb: 6.5
thermal_ceiling_c: 85.0

# ---- UX ----
ui: terminal          # terminal | web
language: en          # en | yo | ha | ig
verbose: false

# ---- sabi-yoruba-tts (African Alpha Bonus, +15%) ----
# NLLB-200-distilled-600M -> int8 CTranslate2 (see scripts/download_yoruba_model.py).
# CC-BY-NC-4.0 (non-commercial) — see REPORT.md §11 for disclosure.
yoruba_enabled: true
yoruba_model_path: models/sabi-yoruba-tts
